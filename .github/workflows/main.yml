name: Build CertInstallerHelper

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/auri16/certinstallerhelper
          mkdir -p app/src/main/res/values

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            '' \
            'rootProject.name = "CertInstallerHelper"' \
            'include(":app")' \
            > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.6.1" apply false' \
            '}' \
            > build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=false' \
            'android.enableJetifier=false' \
            > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            '' \
            'android {' \
            '    namespace "com.auri16.certinstallerhelper"' \
            '    compileSdk 35' \
            '' \
            '    defaultConfig {' \
            '        applicationId "com.auri16.certinstallerhelper"' \
            '        minSdk 17' \
            '        targetSdk 25' \
            '        versionCode 1' \
            '        versionName "1.0"' \
            '    }' \
            '' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '}' \
            > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <application' \
            '        android:allowBackup="false"' \
            '        android:label="Cert Installer Helper"' \
            '        android:theme="@style/AppTheme">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:label="Cert Installer Helper">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' \
            > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <style name="AppTheme" parent="android:style/Theme.Material.Light">' \
            '        <item name="android:fontFamily">sans</item>' \
            '        <item name="android:colorAccent">#0099CC</item>' \
            '    </style>' \
            '</resources>' \
            > app/src/main/res/values/styles.xml

          printf '%s\n' \
            'package com.auri16.certinstallerhelper;' \
            '' \
            'import android.app.Activity;' \
            'import android.os.Bundle;' \
            'import android.content.Intent;' \
            'import android.net.Uri;' \
            'import android.security.KeyChain;' \
            'import android.view.View;' \
            'import android.widget.Button;' \
            'import android.widget.LinearLayout;' \
            'import android.widget.TextView;' \
            'import android.widget.Toast;' \
            '' \
            'import java.io.ByteArrayOutputStream;' \
            'import java.io.InputStream;' \
            '' \
            'public class MainActivity extends Activity {' \
            '' \
            '    private static final int PICK_CERTIFICATE = 1001;' \
            '' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '' \
            '        LinearLayout layout = new LinearLayout(this);' \
            '        layout.setOrientation(LinearLayout.VERTICAL);' \
            '        layout.setPadding(30, 30, 30, 30);' \
            '' \
            '        TextView title = new TextView(this);' \
            '        title.setText("Cert Installer Helper");' \
            '        title.setTextSize(24);' \
            '        layout.addView(title);' \
            '' \
            '        TextView info = new TextView(this);' \
            '        info.setText("Wybierz plik certyfikatu (.der lub .crt), aby przekazać go do systemowego instalatora certyfikatów Androida.");' \
            '        info.setTextSize(16);' \
            '        layout.addView(info);' \
            '' \
            '        Button button = new Button(this);' \
            '        button.setText("WYBIERZ CERTYFIKAT");' \
            '        layout.addView(button);' \
            '' \
            '        button.setOnClickListener(new View.OnClickListener() {' \
            '            @Override'
